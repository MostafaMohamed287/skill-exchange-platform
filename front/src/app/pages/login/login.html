<div class="mx-auto mt-16 max-w-md rounded-xl bg-white p-8 shadow">

    <h2 class="mb-6 text-center text-3xl font-bold">
        Login
    </h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <div class="mb-4">

            <label>Email</label>

            <input
                type="email"
                formControlName="email"
                class="mt-2 w-full rounded-lg border p-3">

        </div>

        <div class="mb-4">

            <label>Password</label>

            <input
                type="password"
                formControlName="password"
                class="mt-2 w-full rounded-lg border p-3">

        </div>

        @if(errorMessage){

        <p class="mb-3 text-red-600">

            {{errorMessage}}

        </p>

        }

        <button
            class="w-full rounded-lg bg-blue-600 p-3 font-semibold text-white hover:bg-blue-700">

            Login

        </button>

    </form>

</div>
